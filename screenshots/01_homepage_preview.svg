    <rect x="800" y="10" width="70" height="30" rx="15" fill="#0f766e" />
    <text x="822" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">All</text>
    <rect x="880" y="10" width="85" height="30" rx="15" fill="#f1f5f9" />
    <text x="898" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Workshop</text>
    <rect x="975" y="10" width="80" height="30" rx="15" fill="#f1f5f9" />
    <text x="996" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Sports</text>
  </g>

  <!-- Event Cards -->
  <g transform="translate(60, 475)">
    <!-- Card 1 -->
    <rect width="340" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="340" height="90" rx="12" fill="#0284c7" />
    <text x="20" y="45" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">AI &amp; Machine Learning Workshop</text>
    <text x="20" y="70" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0f2fe">📅 2026-11-15 • Main Auditorium Hall A</text>
    <text x="20" y="125" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">🟢 76 of 80 Seats Available</text>
    <rect x="20" y="150" width="140" height="32" rx="6" fill="#f1f5f9" />
    <text x="65" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Details</text>
    <rect x="180" y="150" width="140" height="32" rx="6" fill="#0f766e" />
    <text x="215" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Register Now</text>

    <!-- Card 2 -->
    <g transform="translate(370, 0)">
      <rect width="340" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" />
      <rect width="340" height="90" rx="12" fill="#16a34a" />
      <text x="20" y="45" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Annual Sports Gala 2026</text>
      <text x="20" y="70" font-family="Segoe UI, sans-serif" font-size="12" fill="#dcfce7">📅 2026-11-20 • Sports Complex</text>
      <text x="20" y="125" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">🟢 247 of 250 Seats Available</text>
      <rect x="20" y="150" width="140" height="32" rx="6" fill="#f1f5f9" />
      <text x="65" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Details</text>
      <rect x="180" y="150" width="140" height="32" rx="6" fill="#0f766e" />
      <text x="215" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Register Now</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" />
      <rect width="340" height="90" rx="12" fill="#e11d48" />
      <text x="20" y="45" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">TechX Hackathon Competition</text>
      <text x="20" y="70" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffe4e6">📅 2026-12-05 • SE Labs 3 &amp; 4</text>
      <text x="20" y="125" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">🟢 58 of 60 Seats Available</text>
      <rect x="20" y="150" width="140" height="32" rx="6" fill="#f1f5f9" />
      <text x="65" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Details</text>
      <rect x="180" y="150" width="140" height="32" rx="6" fill="#0f766e" />
      <text x="215" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Register Now</text>
    </g>
  </g>
</svg>
