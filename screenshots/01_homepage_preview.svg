<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc" />
  
  <!-- Navbar -->
  <rect width="1200" height="65" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">🏛️ UOL EventHub</text>
  <rect x="200" y="22" width="110" height="24" rx="12" fill="#0f766e" />
  <text x="215" y="38" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">CAMPUS PORTAL</text>
  <text x="450" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f766e">Home</text>
  <text x="520" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#64748b">Browse Events</text>
  <text x="640" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#64748b">My Registrations</text>
  <text x="780" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#64748b">Admin Panel</text>
  <rect x="1040" y="16" width="120" height="34" rx="6" fill="#0f766e" />
  <text x="1065" y="38" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Sign In</text>
  
  <!-- Hero Section -->
  <rect y="65" width="1200" height="260" fill="url(#heroGrad)" />
  <text x="60" y="125" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ccfbf1" letter-spacing="1">THE UNIVERSITY OF LAHORE • OFFICIAL PORTAL</text>
  <text x="60" y="175" font-family="Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Campus Event Management System</text>
  <text x="60" y="215" font-family="Segoe UI, sans-serif" font-size="15" fill="#e6fffa">Explore university seminars, technical workshops, sports galas, hackathons, and society activities.</text>
  
  <rect x="60" y="245" width="180" height="42" rx="8" fill="#f59e0b" />
  <text x="85" y="271" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Browse All Events ➔</text>
  <rect x="260" y="245" width="180" height="42" rx="8" fill="#ffffff" />
  <text x="290" y="271" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#0f766e">Student Sign In</text>

  <!-- Stat Counters -->
  <g transform="translate(60, 295)">
    <rect width="250" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="42" font-size="28">📅</text>
    <text x="65" y="35" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#0f172a">6</text>
    <text x="65" y="55" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Campus Events</text>

    <rect x="275" width="250" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="295" y="42" font-size="28">🎓</text>
    <text x="340" y="35" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#0f172a">5</text>
    <text x="340" y="55" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Active Students</text>

    <rect x="550" width="250" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="570" y="42" font-size="28">🎟️</text>
    <text x="615" y="35" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#0f172a">8</text>
    <text x="615" y="55" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Registrations</text>

    <rect x="825" width="255" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="845" y="42" font-size="28">🏛️</text>
    <text x="890" y="35" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#0f172a">6+</text>
    <text x="890" y="55" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Societies &amp; Depts</text>
  </g>

  <!-- Filter & Event Cards Sample -->
  <g transform="translate(60, 400)">
    <rect width="1080" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" />
